<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MYCPE ONE – Sales Workflows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#262448; --muted:#625F80; --line:#DEDCEB;
  --brand:#4A4FD1; --brand-soft:#ECEBFC;
  --grad:linear-gradient(110deg,#5EC8F3 0%,#426DE8 45%,#6438BE 100%); --grad2:linear-gradient(120deg,#426DE8,#6438BE); --client:#0E8A6A; --client-soft:#E2F4EE;
  --loop:#B5651D; --loop-soft:#FBEFE3; --stop:#B23A48; --stop-soft:#F9E6E8;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 24px 64px}

header{padding-bottom:24px;border-bottom:1px solid var(--line)}
.topbar{height:4px;background:var(--grad)}
.logo{display:block;height:34px;width:auto;margin-bottom:14px}
h1,h2,h3,h4,.title,.phead,.bhead,.oq,.blabel,.stab b,.tnode b,.sc b{font-family:Poppins,Inter,system-ui,sans-serif}
h1{margin:6px 0 0;font-size:clamp(28px,4vw,40px);line-height:1.12;font-weight:600;letter-spacing:-.015em}
.lede{margin:10px 0 0;color:var(--muted);max-width:62ch}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.tab{all:unset;box-sizing:border-box;cursor:pointer;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500;background:var(--surface)}
.tab[aria-selected="true"]{background:var(--grad2);border-color:transparent;color:#fff;font-weight:600}
.tab:focus-visible,.stab:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.tab[disabled]{cursor:default;opacity:.55;background:transparent}

.optbar{margin-top:28px;padding:22px 24px 24px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.optbar .oq{margin:0;font-weight:600;font-size:16px}
.optbar .oh{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.subtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.stab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg)}
.stab .on{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);flex:none}
.stab small{display:block;font-size:13px;color:var(--muted);font-weight:500}
.stab b{display:block;font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
.stab[aria-selected="true"]{border-color:var(--brand);background:var(--brand-soft)}
.stab[aria-selected="true"] .on{background:var(--grad2);border-color:transparent;color:#fff}
.stab[aria-selected="true"] small{color:var(--brand)}
.obadge{display:inline-block;font-size:13px;font-weight:600;color:var(--brand);background:var(--brand-soft);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.path.opt{margin-top:40px}

.path{margin-top:30px}
.path h2{margin:0;font-size:21px;font-weight:600}
.path .pdesc{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:70ch}

.flow{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.step{position:relative;padding:0 10px}
.step:not(:last-child)::before{content:"";position:absolute;top:33px;left:calc(50% + 36px);right:-2px;height:2px;background:var(--line)}
.step:not(:last-child)::after{content:"";position:absolute;top:28px;right:-5px;width:12px;height:12px;border-top:2px solid var(--line);border-right:2px solid var(--line);transform:rotate(45deg)}
.node{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;padding-bottom:10px;border-radius:14px}
.node:focus-visible,.ms:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.dot{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:20px;color:var(--muted);transition:background .2s,border-color .2s,color .2s;flex:none}
.is-loop .dot{border-style:dashed;border-color:var(--loop);color:var(--loop)}
.is-client .dot{border-color:var(--client);color:var(--client)}
.is-decide .dot{border-radius:16px;transform:rotate(45deg);width:56px;height:56px;margin:6px 0;border-color:var(--brand);color:var(--brand)}
.is-decide .dot span{transform:rotate(-45deg)}
.node[aria-pressed="true"] .dot{background:var(--grad2);border-color:transparent;color:#fff}
.is-loop .node[aria-pressed="true"] .dot{background:var(--loop);border-color:var(--loop);border-style:solid;color:var(--surface)}
.is-client .node[aria-pressed="true"] .dot{background:var(--client);border-color:var(--client);color:var(--surface)}
.title{margin-top:14px;font-weight:600;font-size:16px;line-height:1.3}
.sub{margin-top:4px;font-size:13.5px;color:var(--muted);line-height:1.4}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:10px}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:500}
.is-loop .tag{background:var(--loop-soft);color:var(--loop)}
.is-client .tag{background:var(--client-soft);color:var(--client)}
.loopnote{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--loop);font-weight:500}

/* Option 2: continuous trial flow */
.tflow{margin-top:30px;display:flex;flex-direction:column;align-items:center}
.tnode{all:unset;box-sizing:border-box;cursor:pointer;width:min(440px,100%);display:flex;gap:14px;align-items:center;text-align:left;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);--c:var(--brand);--cs:var(--brand-soft)}
.tnode:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.tnode .n{width:38px;height:38px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--surface)}
.tnode.decide .n{border-radius:9px;transform:rotate(45deg);width:30px;height:30px;margin:4px}
.tnode.decide .n span{transform:rotate(-45deg)}
.tnode.loop{--c:var(--loop);--cs:var(--loop-soft)}
.tnode.loop .n{border-style:dashed}
.tnode b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.tnode .t{display:block;font-size:13.5px;color:var(--muted);line-height:1.4;margin-top:2px}
.tnode[aria-pressed="true"]{background:var(--cs);border-color:var(--c)}
.tnode[aria-pressed="true"] .n{background:var(--c);color:var(--surface);border-style:solid}
.vl{width:2px;height:30px;background:var(--line);position:relative;flex:none}
.vl::after{content:"";position:absolute;bottom:1px;left:50%;margin-left:-5px;width:8px;height:8px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.vl.plain{height:26px}
.vl.plain::after{display:none}
.bgrid2{display:grid;grid-template-columns:repeat(var(--b,3),1fr);width:100%;position:relative}
.bgrid2::before{content:"";position:absolute;top:0;left:calc(100% / (2 * var(--b,3)));right:calc(100% / (2 * var(--b,3)));height:2px;background:var(--line)}
.bcol{display:flex;flex-direction:column;align-items:center;padding:0 8px}
.bcol.con{--c:var(--client);--cs:var(--client-soft)}
.bcol.ext{--c:var(--loop);--cs:var(--loop-soft)}
.bcol.can{--c:var(--stop);--cs:var(--stop-soft)}
.bcol .tnode{--c:inherit;--cs:inherit;width:100%}
.bcol .vl{background:var(--c)}
.bcol .vl::after{border-color:var(--c)}
.bcol .vl.top{height:26px}
.blabel{font-weight:700;font-size:14.5px;color:var(--c);background:var(--cs);padding:6px 16px;border-radius:999px;border:1.5px solid var(--c)}
.bdesc{font-size:13.5px;color:var(--muted);margin:6px 0 0;text-align:center}
.fork{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.fork .or{font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px}
.pill.con{background:var(--client-soft);color:var(--client);border:1.5px solid var(--client)}
.pill.can{background:var(--stop-soft);color:var(--stop);border:1.5px solid var(--stop)}
@media (max-width:900px){
  .bgrid2{grid-template-columns:1fr;gap:10px}
  .bgrid2::before{display:none}
}

/* Phased options (Website Development) */
.phase{margin-top:30px}
.phase.shared{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px 14px}
.phead{margin:0;font-weight:600;font-size:17px}
.phase .pdesc{margin:2px 0 0;font-size:14.5px}
.sbadge{display:inline-block;font-size:12.5px;font-weight:600;color:var(--client);background:var(--client-soft);padding:3px 10px;border-radius:999px;margin-left:8px;vertical-align:2px}
.phlink{display:flex;justify-content:center;margin-top:14px}
.phase .flow{margin-top:22px}

/* Other statuses (Offshoring after sign-up) */
.side{margin-top:34px;padding-top:26px;border-top:1px dashed var(--line)}
.side .bhead{margin:0;font-weight:600;font-size:17px}
.side .bsub{margin:2px 0 0;color:var(--muted);font-size:14.5px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.sc{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:14px;padding:14px 16px}
.sc:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.sc.ext{--c:var(--loop);--cs:var(--loop-soft)}
.sc.can{--c:var(--stop);--cs:var(--stop-soft)}
.sc.brand{--c:var(--brand);--cs:var(--brand-soft)}
.sc[aria-pressed="true"]{background:var(--cs)}
.sc b{display:block;font-size:16px;font-weight:600;color:var(--c)}
.sc .when{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--cs);color:var(--c)}
.sc .t{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.45}
@media (max-width:1000px){.sgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.sgrid{grid-template-columns:1fr}}

/* Detail */
.detail{margin-top:36px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 30px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px 40px}
.detail h3{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.detail .num{color:var(--muted);font-size:14px;font-weight:500}
.detail p{margin:12px 0 0;max-width:62ch}
.detail ul{margin:10px 0 0;padding-left:20px}
.detail li{margin:4px 0}
.detail .lbl{margin-top:16px;font-weight:600}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:12px 18px;align-content:start}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:500}

.src{grid-column:1/-1;border-top:1px solid var(--line);padding-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px 40px}
.src h4{margin:0;font-size:18px;font-weight:600}
.src .in h4{color:var(--brand)}
.src .out h4{color:var(--loop)}
.src .dir{font-size:14px;color:var(--muted);margin:2px 0 0}
.grp{margin-top:16px}
.grp b{font-size:14px;font-weight:600;display:block;margin-bottom:8px}
.grp b small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.chip i{font-style:normal;color:var(--muted);font-size:12.5px}

footer{margin-top:40px;font-size:13px;color:var(--muted)}

@media (max-width:900px){
  .flow{grid-template-columns:1fr}
  .step{padding:0 0 28px}
  .step:not(:last-child)::before{top:76px;left:33px;right:auto;width:2px;height:calc(100% - 78px)}
  .step:not(:last-child)::after{top:auto;bottom:8px;left:27px;right:auto;transform:rotate(135deg)}
  .node{flex-direction:row;align-items:flex-start;text-align:left;gap:18px}
  .is-decide .node{gap:24px;padding-left:6px}
  .title{margin-top:4px}
  .tags{justify-content:flex-start}
  .bgrid{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr;padding:22px}
  .src{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const main=document.getElementById('main');
let items=[];
let state={biz:'offshoring',path:0};

function render(){
  const biz=data[state.biz];
  const p=biz.paths[state.path];
  document.getElementById('h1').textContent=`${biz.name} sales workflow`;
  document.querySelectorAll('.tab[data-biz]').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.biz===state.biz)));
  items=[]; main.innerHTML='';

  if(biz.paths.length>1){
    const bar=document.createElement('div'); bar.className='optbar';
    const pick=biz.pick||{q:"Choose an option",h:`A firm can come on board in ${biz.paths.length} ways. Select one to see its process below.`};
    bar.innerHTML=`<p class="oq">${pick.q}</p><p class="oh">${pick.h}</p>`;
    const st=document.createElement('div'); st.className='subtabs'; st.setAttribute('role','tablist'); st.setAttribute('aria-label','Options');
    biz.paths.forEach((x,i)=>{const [lab,ttl]=x.tab.split(': ');st.insertAdjacentHTML('beforeend',`<button class="stab" role="tab" type="button" aria-selected="${i===state.path}" data-path="${i}"><span class="on">${i+1}</span><span><small>${lab}</small><b>${ttl}</b></span></button>`);});
    bar.appendChild(st); main.appendChild(bar);
  }

  const sec=document.createElement('section'); sec.className='path';
  if(biz.paths.length>1) sec.classList.add('opt');
  sec.innerHTML=`${biz.paths.length>1?`<span class="obadge">${p.tab.split(': ')[0]}</span>`:''}<h2>${p.name}</h2><p class="pdesc">${p.desc}</p>`;
  const ol=document.createElement('ol'); ol.className='flow';
  ol.style.setProperty('--n', p.steps.length);
  p.steps.forEach((s,i)=>{
    const idx=items.push({...s,pos:`Step ${i+1} of ${p.steps.length}`})-1;
    const li=document.createElement('li');
    li.className='step'+(s.kind?` is-${s.kind}`:'');
    const mark = s.kind==='client'?'✓':(s.kind==='decide'?'?':i+1);
    li.innerHTML=`<button class="node" type="button" aria-pressed="false" data-i="${idx}">
      <span class="dot"><span>${mark}</span></span>
      <span>
        <div class="title">${s.title}</div>
        <div class="sub">${s.sub}</div>
        <div class="tags">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        ${s.kind==='loop'?`<div class="loopnote">${loopIcon} ${s.loopnote||'Repeats until sign-up'}</div>`:''}
      </span></button>`;
    ol.appendChild(li);
  });
  if(!p.trial && !p.phases){ sec.appendChild(ol); }
  else if(p.trial){
    items=[];
    const tf=document.createElement('div'); tf.className='tflow';
    const node=(s,idx,num,cls='')=>`<button class="tnode ${cls}" type="button" aria-pressed="false" data-i="${idx}"><span class="n"><span>${num}</span></span><span><b>${s.title}</b><span class="t">${s.t||s.sub}</span></span></button>`;
    p.steps.forEach((s,i)=>{
      const idx=items.push({...s,pos:`Step ${i+1} of ${p.steps.length}`})-1;
      if(i) tf.insertAdjacentHTML('beforeend','<div class="vl"></div>');
      tf.insertAdjacentHTML('beforeend',node(s,idx,s.kind==='decide'?'?':i+1,s.kind||''));
    });
    tf.insertAdjacentHTML('beforeend','<div class="vl plain"></div>');
    const g=document.createElement('div'); g.className='bgrid2'; g.style.setProperty('--b',p.branches.length);
    p.branches.forEach(br=>{
      let h=`<div class="bcol ${br.cls}"><div class="vl top"></div><span class="blabel">${br.title}</span><p class="bdesc">${br.desc}</p>`;
      br.steps.forEach((s,i)=>{
        const idx=items.push({...s,pos:`${br.title}: step ${i+1} of ${br.steps.length}`})-1;
        h+=`<div class="vl"></div>`+node(s,idx,s.kind==='client'?'✓':i+1);
        if(s.pills){ const pl=s.pills===true?[['con','Sign up'],['can','Cancelled']]:s.pills; h+=`<div class="vl"></div><div class="fork">${pl.map(([c,l])=>`<span class="pill ${c}">${l}</span>`).join('<span class="or">or</span>')}</div>`; }
      });
      g.insertAdjacentHTML('beforeend',h+'</div>');
    });
    tf.appendChild(g); sec.appendChild(tf);
  }

  if(p.side){
    const sd=document.createElement('div'); sd.className='side';
    sd.innerHTML=`<p class="bhead">${p.sideTitle}</p><p class="bsub">${p.sideDesc}</p>`;
    const g=document.createElement('div'); g.className='sgrid';
    p.side.forEach(s=>{
      const idx=items.push({...s,pos:`Other status: ${s.when}`})-1;
      g.insertAdjacentHTML('beforeend',`<button class="sc ${s.cls}" type="button" aria-pressed="false" data-i="${idx}"><b>${s.title}</b><span class="when">${s.when}</span><span class="t">${s.t}</span></button>`);
    });
    sd.appendChild(g); sec.appendChild(sd);
  }

  if(p.phases){
    let n=0; const total=p.phases.reduce((a,ph)=>a+ph.steps.length,0);
    p.phases.forEach((ph,pi)=>{
      if(pi) sec.insertAdjacentHTML('beforeend','<div class="phlink"><div class="vl"></div></div>');
      const box=document.createElement('div'); box.className='phase'+(ph.shared?' shared':'');
      box.innerHTML=`<p class="phead">${ph.title}${ph.shared&&biz.paths.length>1?'<span class="sbadge">Same for both options</span>':''}</p><p class="pdesc">${ph.desc}</p>`;
      const o=document.createElement('ol'); o.className='flow'; o.style.setProperty('--n',ph.steps.length);
      ph.steps.forEach(s=>{ n++; const idx=items.push({...s,pos:`Step ${n} of ${total}`})-1; o.insertAdjacentHTML('beforeend',stepLI(s,idx,n)); });
      box.appendChild(o); sec.appendChild(box);
    });
  }

  const d=document.createElement('article'); d.className='detail'; d.id='detail'; d.setAttribute('aria-live','polite');
  sec.appendChild(d);
  main.appendChild(sec);
  show(0);
}

function show(i){
  const s=items[i];
  main.querySelectorAll('[data-i]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.i===i)));
  document.getElementById('detail').innerHTML=`
    <div>
      <div class="num">${s.pos}</div>
      <h3>${s.title}</h3>
      <p>${s.body}</p>
      ${s.points?`<p class="lbl">${s.lbl}</p><ul>${s.points.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    </div>
    <dl>
      <dt>Who’s involved</dt><dd>${s.who}</dd>
      <dt>Channel or tool</dt><dd>${s.how}</dd>
      <dt>What comes next</dt><dd>${s.next}</dd>
    </dl>${s.sources?srcHTML:''}`;
}

main.addEventListener('click',e=>{
  const sp=e.target.closest('[data-path]'); if(sp){state.path=+sp.dataset.path; render(); return;}
  const b=e.target.closest('[data-i]'); if(!b) return;
  show(+b.dataset.i);
  const d=document.getElementById('detail'), r=d.getBoundingClientRect();
  if(r.top>innerHeight-140) d.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
});
document.querySelectorAll('.tab[data-biz]').forEach(t=>t.addEventListener('click',()=>{state={biz:t.dataset.biz,path:0}; render();}));
render();
</script>
</body>
</html>
